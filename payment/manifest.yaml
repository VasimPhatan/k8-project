apiVersion: v1 
kind: ConfigMap
metadata: 
  name: rabbitmq
  namespace: roboshop
data: 
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
  AMQP_USER: "roboshop"
  AMQP_PASS: "roboshop123"

---
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: rabbitmq
  namespace: roboshop

spec:
  replicas: 1
  selector:
    matchLabels:
      component: app
      project: roboshop
  
  template:
    metadata :
      labels: 
        component: app
        project: roboshop
    spec:
      containers:
      - name: rabbitmq
        image: vasimphatan/rabbitmq:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
           name: rabbitmq
        

---
apiVersion: v1 
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop

spec:
  type: ClusterIP 
  selector:
    component: app
    project: roboshop
  ports:
  - protocol : TCP
    port: 8080
    targetPort: 8080

