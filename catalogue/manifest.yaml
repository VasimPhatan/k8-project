apiVersion: v1 
kind: ConfigMap
metadata: 
  name: catalogue
  namespace: roboshop
data: 
  MONGO: "true"
  MONGO_URL: "mongodb://mongodb:27017/catalogue"

---
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop

spec:
  replicas: 1
  selector:
    matchLabels:
      component: app
      project: roboshop
  
  template:
    metadata :
      labels: 
        component: app
        project: roboshop
    spec:
      containers:
      - name: catalogue
        image: vasimphatan/catalogue:v1
        envFrom:
        - configMapRef:
           name: catalogue
        

---
apiVersion: v1 
kind: Service
metadata:
  name: catalogue
  namespace: roboshop

spec:
  type: ClusterIP 
  selector:
    component: app
    project: roboshop
  ports:
  - protocol : TCP
    port: 8080
    targetPort: 8080

