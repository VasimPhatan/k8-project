apiVersion: apps/v1 
kind: Deployment
metadata:
  name: redis
  namespace: roboshop

spec:
  replicas: 1
  selector:
    matchLabels:
      component: db
      project: roboshop
  
  template:
    metadata :
      labels: 
        component: db
        project: roboshop
    spec:
      containers:
      - name: redis
        image: vasimphatan/redis:v1
    

---
apiVersion: v1 
kind: Service
metadata:
  name: redis
  namespace: roboshop

spec:
  type: ClusterIP 
  selector:
    component: db
    project: roboshop
  ports:
  - protocol : TCP
    port: 6379
    targetPort: 6379

  