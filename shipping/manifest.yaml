apiVersion: v1 
kind: ConfigMap
metadata: 
  name: shipping
  namespace: roboshop
data: 
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql"

---
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop

spec:
  replicas: 1
  selector:
    matchLabels:
      component: app
      project: roboshop
  
  template:
    metadata :
      labels: 
        component: app
        project: roboshop
    spec:
      containers:
      - name: shipping
        image: vasimphatan/shipping:v1
        envFrom:
        - configMapRef:
           name: shipping
        

---
apiVersion: v1 
kind: Service
metadata:
  name: shipping
  namespace: roboshop

spec:
  type: ClusterIP 
  selector:
    component: app
    project: roboshop
  ports:
  - protocol : TCP
    port: 8080
    targetPort: 8080

